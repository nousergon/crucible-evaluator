name: Deploy

on:
  push:
    branches: [main]
    paths:
      # Only rebuild + redeploy when code/infra that actually lands in the
      # Docker image changes. Docs, tests, CI, and IAM/example files do not.
      #
      # THIS LIST IS ALSO THE DRIFT PREDICATE (alpha-engine-config-I9168).
      # The Saturday pipeline (ne-weekly-freshness-pipeline) hard-fails at
      # EvaluatorDeployDriftGate / EvaluatorDirectorDeployDriftGate on
      # has_drift (config#2348, 2026-07-13). That gate now calls a SHA
      # mismatch drift only when a commit in baked..HEAD touched a path
      # BELOW, via grading/deploy_paths.py::is_deploy_relevant_path — which
      # tests/test_deploy_path_contract.py pins to be this exact list. So a
      # merge this filter skips is provably not drift and needs NO manual
      # deploy: the previous "remedy: trigger a workflow_dispatch by hand"
      # was a post-merge step nothing failed when it never ran, and on
      # 2026-08-28 it did not run and armed both Lambdas to kill the next
      # weekly run.
      #
      # Adding a source to the image means adding it HERE. The contract test
      # asserts every Dockerfile COPY source is covered by this list, so a
      # new surface fails on its own PR rather than shipping un-deployed.
      - 'grading/**'
      - 'director/**'
      - 'flow-doctor.yaml'
      - 'requirements*.txt'
      - 'Dockerfile*'
      - 'infrastructure/deploy.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:  # manual trigger from the Actions UI (e.g. to ship an
                      # already-merged change without a fresh image-affecting push)

# Only one deploy at a time; never cancel an in-progress deploy mid-push.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC role assumption
  contents: read

jobs:
  deploy:
    name: Build + deploy evaluator + director Lambdas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout evaluator repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # LLM_MODEL_REGISTRY.yaml is downloaded from S3 at Lambda startup by
      # director/handler.py's _ensure_registry() — no build-time staging needed.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6
        with:
          role-to-assume: arn:aws:iam::711398986525:role/github-actions-lambda-deploy
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2

      # deploy.sh's canary steps run `python3 -m krepis.aws invoke-canary`
      # directly on THIS runner (not inside the Lambda's Docker image) —
      # krepis is the shared throttle-aware invoke CLI (config#1494). The
      # runner's stock Python has no project packages, so without this step
      # every canary invoke dies with `ModuleNotFoundError: No module named
      # 'krepis'` (surfaced 2026-07-01, config#1494 follow-up: the CLI
      # conversion wired the call but never installed it on the caller).
      # Pin is derived dynamically from requirements.txt to prevent drift;
      # setup-python pins the interpreter so the pip install target doesn't
      # drift with GH's ubuntu-latest image updates.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      # `pip install -r`, never `pip install "$(grep ...)"`. Interpolating the
      # matched LINE into a quoted argument hands pip the trailing inline
      # comment as part of the requirement, and pip rejects the whole thing:
      #
      #   ERROR: Invalid requirement: 'krepis[flow-doctor,openai]==0.59.17
      #   # pinned per §139 - ...': Expected comma (within version specifier)
      #
      # That is exactly what happened when the pin line gained its §139 comment
      # on 2026-08-19: this workflow went red and STAYED red for four merges,
      # so crucible-evaluator was merged-but-not-live from 2026-08-19 21:12 UTC
      # (alpha-engine-config-I7855). Feeding pip a requirements FILE puts
      # comment handling in pip's own parser instead of in our regex.
      - name: Install krepis (runner-side canary CLI)
        run: pip install -r <(grep '^krepis\[' requirements.txt)

      # deploy.sh builds the single ECR image and deploys BOTH the grading
      # Lambda (alpha-engine-evaluator) and the Director Lambda
      # (alpha-engine-evaluator-director — same image, CMD override). It
      # canaries each (grading expects status:ok; director expects
      # status:disabled while DIRECTOR_ENABLED is off) and repoints the :live
      # alias. It PRESERVES any operator-set DIRECTOR_ENABLED — the auto-deploy
      # never resets the flag.
      - name: Build image + deploy both Lambdas
        run: bash infrastructure/deploy.sh

      - name: Report deployed versions
        run: |
          echo "Deployed commit: ${{ github.sha }}"
          for fn in alpha-engine-evaluator alpha-engine-evaluator-director; do
            echo "== $fn =="
            aws lambda get-function \
              --function-name "$fn" \
              --query "Configuration.[LastModified,CodeSha256]" \
              --output text
          done

      - name: Append to system-wide deploy changelog
        if: always()
        uses: nousergon/nousergon-docs/.github/actions/append-changelog@6ed6c2050ecd4e87284283c7ee16539672704fc9
        with:
          deploy_status: ${{ job.status == 'success' && 'success' || 'failure' }}
          deploy_workflow: deploy.yml
          subsystem: evaluator

  # Alert (Telegram) on genuine post-merge failure of this workflow on the
  # default branch. Reusable workflow + transport in nousergon-lib. config#1128.
  notify-main-failure:
    needs: [deploy]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@5363e60b9343e270be9a44d41e85516068b4226e
    secrets: inherit
