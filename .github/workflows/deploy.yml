name: Deploy

on:
  push:
    branches: [main]
    paths:
      # Only rebuild + redeploy when code/infra that actually lands in the
      # Docker image changes. Docs, tests, CI, and IAM/example files do not.
      # WARNING: the Saturday pipeline (ne-weekly-freshness-pipeline) DOES
      # check evaluator + director deploy-drift via EvaluatorDeployDriftGate
      # and EvaluatorDirectorDeployDriftGate (config#2348, 2026-07-13). A
      # CI-only push to main that doesn't match this paths filter WILL cause
      # the next Saturday run to fail on sha_mismatch — the Lambdas are still
      # stamped with the prior deploy SHA while main HEAD advanced. Remedy:
      # after merging a CI-only PR, trigger a manual deploy via
      # workflow_dispatch (the Actions UI tab) to re-stamp the Lambdas.
      - 'grading/**'
      - 'director/**'
      - 'requirements*.txt'
      - 'Dockerfile*'
      - 'infrastructure/deploy.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:  # manual trigger from the Actions UI (e.g. to ship an
                      # already-merged change without a fresh image-affecting push)

# Only one deploy at a time; never cancel an in-progress deploy mid-push.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC role assumption
  contents: read

jobs:
  deploy:
    name: Build + deploy evaluator + director Lambdas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout evaluator repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # deploy.sh stages LLM_MODEL_REGISTRY.yaml from nousergon/alpha-engine-config
      # into the Docker build context so krepis.router.resolve_group_structured()
      # can resolve the Director's model group. This is a public repo without
      # private-docs/ on disk — the file comes from the private config repo.
      # Mirrors crucible-predictor's config-staging pattern.
      # Fine-grained PAT with read-only Contents access on alpha-engine-config
      # is stored as ALPHA_ENGINE_CONFIG_TOKEN.
      - name: Checkout alpha-engine-config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: nousergon/alpha-engine-config
          path: alpha-engine-config
          token: ${{ secrets.ALPHA_ENGINE_CONFIG_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6
        with:
          role-to-assume: arn:aws:iam::711398986525:role/github-actions-lambda-deploy
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64  # v2

      # deploy.sh's canary steps run `python3 -m krepis.aws invoke-canary`
      # directly on THIS runner (not inside the Lambda's Docker image) —
      # krepis is the shared throttle-aware invoke CLI (config#1494). The
      # runner's stock Python has no project packages, so without this step
      # every canary invoke dies with `ModuleNotFoundError: No module named
      # 'krepis'` (surfaced 2026-07-01, config#1494 follow-up: the CLI
      # conversion wired the call but never installed it on the caller).
      # Pin is derived dynamically from requirements.txt to prevent drift;
      # setup-python pins the interpreter so the pip install target doesn't
      # drift with GH's ubuntu-latest image updates.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      - name: Install krepis (runner-side canary CLI)
        run: pip install "$(grep '^krepis\[' requirements.txt)"

      # deploy.sh builds the single ECR image and deploys BOTH the grading
      # Lambda (alpha-engine-evaluator) and the Director Lambda
      # (alpha-engine-evaluator-director — same image, CMD override). It
      # canaries each (grading expects status:ok; director expects
      # status:disabled while DIRECTOR_ENABLED is off) and repoints the :live
      # alias. It PRESERVES any operator-set DIRECTOR_ENABLED — the auto-deploy
      # never resets the flag.
      - name: Build image + deploy both Lambdas
        env:
          # deploy.sh defaults CONFIG_REPO_DIR to $(dirname $PWD)/
          # alpha-engine-config — exactly where the checkout step above
          # placed it.
          CONFIG_REPO_DIR: ${{ github.workspace }}/alpha-engine-config
        run: bash infrastructure/deploy.sh

      - name: Report deployed versions
        run: |
          echo "Deployed commit: ${{ github.sha }}"
          for fn in alpha-engine-evaluator alpha-engine-evaluator-director; do
            echo "== $fn =="
            aws lambda get-function \
              --function-name "$fn" \
              --query "Configuration.[LastModified,CodeSha256]" \
              --output text
          done

      - name: Append to system-wide deploy changelog
        if: always()
        uses: nousergon/nousergon-docs/.github/actions/append-changelog@6ed6c2050ecd4e87284283c7ee16539672704fc9
        with:
          deploy_status: ${{ job.status == 'success' && 'success' || 'failure' }}
          deploy_workflow: deploy.yml
          subsystem: evaluator

  # Alert (Telegram) on genuine post-merge failure of this workflow on the
  # default branch. Reusable workflow + transport in nousergon-lib. config#1128.
  notify-main-failure:
    needs: [deploy]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@62597e550c08c0b7a7fe0af490cb141e344061b3
    secrets: inherit
