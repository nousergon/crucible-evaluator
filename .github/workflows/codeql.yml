name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"  # Mondays 07:00 UTC

# Least privilege for every job that does not declare its own (CodeQL
# actions/missing-workflow-permissions, alpha-engine-config-I10559). The
# notify-ci-failure reusable workflow declares `permissions: {}` itself.
permissions:
  contents: read

jobs:
  analyze:
    # Both languages GitHub default setup would have scanned here. `actions`
    # covers the workflow files themselves; dropping it when this repo moved to
    # advanced setup silently removed that coverage (config-I7518).
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

  # Alert (Telegram) on genuine post-merge failure of this workflow on the
  # default branch. Reusable workflow + transport in nousergon-lib. config#1128.
  notify-main-failure:
    needs: [analyze]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@05caaeee6ef28bfb0092bb9c66ec4b81fa690968
    secrets: inherit
