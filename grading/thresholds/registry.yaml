# registry.yaml — the Report Card v2 threshold slot (alpha-engine-config#7476).
#
# WHAT THIS IS
# Every `target` / `red_line` the card grades a MetricRecord against. Until
# 2026-08-16 these were ~150 literals scattered across `grading/tiles/*.py`,
# which made the card's most consequential decision — where GREEN stops and RED
# starts — unmeasurable: no arm, no history, nothing that could answer whether a
# GREEN at week t said anything about week t+1.
#
# The values below are the literals as they stood at commit 9712bc7, moved here
# BYTE FOR BYTE. This file is therefore behaviour-preserving on the day it
# lands: the champion arm (`declared_v2`) reproduces the previous card exactly.
#
# HOW IT CHANGES
# By PR, never by code. `grading/thresholds/promote.py` performs a promotion
# (swap `slot.champion`, record the evidence in EXPERIMENTS.md); the challenger
# `history_bands_v1` proposes bands every cycle as shadow output and is scored
# beside the champion in `evaluator/{date}/threshold_leaderboard.json`.
#
# ROW SEMANTICS
#   target/red_line: null    an ungraded metric — a real, documented state.
#                            Distinct from an ABSENT row, which raises.
#   dynamic: true            bands come from the data itself; the call site
#                            passes them and must say where they come from.
#   higher_is_better         the DECLARED direction, used by the challenger to
#                            orient its quantiles. `build_metric` still infers
#                            its own from the target/red_line ordering exactly
#                            as before — this field does not feed grading.
#   n_floor_declared         the sample floor observed at the call site, recorded
#                            for the challenger's context. Not injected: floors
#                            are frequently data-dependent and stay with the tile.
#   surface_tile             the CARD TILE this row renders on, when that is not
#                            its owning module. A row is keyed by the module
#                            whose contribution it measures; the card groups the
#                            `*_contribution_lift` family onto its own tile
#                            instead. Absent ⇒ surface_tile == module. This is
#                            what makes each tile's DECLARED roster derivable, so
#                            `module_agg.build_tile` grades against the roster
#                            rather than against whatever its builder handed it
#                            (alpha-engine-config-I9612). Declared, never
#                            inferred from the name — a suffix heuristic is a
#                            pattern match over an identifier, which is the
#                            failure mode `console-policy.md` §2.6 names.
version: 1

slot:
  id: report_card_thresholds
  decision: >-
    the target/red_line bands that turn a measured MetricRecord value into
    GREEN / WATCH / RED on the weekly Report Card
  champion: declared_v2
  arms:
    - declared_v2         # hand-declared bands, incumbent since RC v2 (bootstrap-promoted, §9.1)
    - history_bands_v1    # history-derived empirical bands, shadow only
  arm_detail:
    declared_v2:
      kind: declared
      promoted: 2026-05-22
      bootstrap: true     # §9.1 — a slot with no prior champion; an arm had to serve
      note: >-
        the bands in `metrics:` below. Chosen by hand from the RC v2 design doc
        (alpha-engine-docs/private/system-report-card-revamp-260522.md); never
        scored against an outcome until this slot existed.
    history_bands_v1:
      kind: derived
      registered: 2026-08-16
      module: grading.thresholds.challenger
      note: >-
        per-metric empirical bands from the prior-card series, split on the sign
        of the realized next-cycle objective. Shadow output only — never consumed
        for status until promoted.

  # The yardstick BOTH arms are scored on. Not the card: the judge is never
  # scored on the scorecard it grades (champion-challenger §8).
  objective:
    name: next_cycle_realized_log_alpha_vs_spy
    source: >-
      evaluator/{date}/report_card.json ::
      tiles.portfolio_outcome.components[name=alpha_vs_spy].value
    producer: grading/tiles/portfolio_outcome.py:530-535 (estimator cumulative_log_alpha,
      grading/tiles/portfolio_outcome.py:75)
    derivation: cumulative_delta
    derivation_detail: >-
      `alpha_vs_spy` is CUMULATIVE log-alpha since inception, so the alpha
      REALIZED between two cards is the difference of their values:
      objective(t) = value(t + horizon_cycles) - value(t). Prior cards are the
      SSOT for graded values (the same binding rule grading/history.py states);
      no re-derivation from raw upstream artifacts.
    unit: log_return
    benchmark: SPY
    horizon_cycles: 4
    horizon_trading_days: 20
    horizon_note: >-
      the fleet-canonical horizon is 21 TRADING days; cards are weekly, so the
      nearest card-aligned window is 4 cycles = 20 trading days. T2
      (alpha-engine-config#7475) owns the formal objective spec — when it lands,
      this block is the single place that changes.

  scoring:
    metric: brier
    label: "1[objective > 0]"
    estimator: leave_one_out_empirical_rate_by_status
    estimator_detail: >-
      each arm assigns a status to every graded (module, metric) on card t from
      its own bands; the predicted P(objective > 0) for a status is that status's
      empirical hit rate over the cohort with the observation itself held out, so
      an arm cannot score itself on a rate it defined. Brier = mean squared error
      of those probabilities against the realized label.
    statuses_scored: [GREEN, WATCH, RED]
    cohort_max_cards: 104          # ~2y of weekly cards
    n_floor_cards: 26              # half a year of PAIRED (t, t+horizon) cards
    n_floor_per_status: 5
    clustering: >-
      observations within one card share a single objective realization, so
      n_cards is the honest sample size and n_observations is reported beside it.
      The floor is on CARDS.

  # §4 — hold everything constant except the thing under test.
  count_matching:
    rule: shared_cohort_intersection
    unit: [card_date, module, metric]
    detail: >-
      both arms are scored over the intersection of (card, metric) cells where
      EVERY arm produced a band and the card carried a value-bearing status.
      An arm that abstains on a metric removes that cell from every arm's
      cohort, never just its own.
    vacuity_guard: >-
      an arm whose bands resolve identically to the champion's on every scored
      cell is reported `vacuous` — a comparison of a rule with itself is not a
      comparison.

  # §5.2 — lead by a margin, not merely lead.
  hysteresis:
    promotion_margin_brier: 0.02
    demotion_margin_brier: 0.02
    cooldown_cycles: 4

  # §7.1 — the horizon may never exceed the retention of the data it reads.
  # Asserted at load in grading/thresholds/registry.py::parse_registry.
  retention:
    source_prefix: "evaluator/"
    cycle_days: 7
    expiry_days: null
    measured: >-
      2026-08-16, `aws s3api get-bucket-lifecycle-configuration --bucket
      alpha-engine-research`: two rules only, `staging/` at 7d and `features/` at
      365d. No rule matches `evaluator/`, so report cards are retained
      indefinitely and no horizon is structurally impossible. If an expiry rule
      is ever added to this prefix, set expiry_days here and the load-time
      assertion becomes live.

# Bands that belong to a BRANCH rather than to a metric — the same fallback rule
# applied to whichever metric took that path. The metric's own row must still
# exist; the shared band overrides the numbers.
shared_bands:
  unbanded:
    target: null
    red_line: null
    note: >-
      the N/A construction paths (retired components, whole-tile missing-input
      shells) that emitted no bands before this registry existed. Preserved
      exactly: an N/A record carries no bar.
  raw_precision:
    target: 0.45
    red_line: 0.35
    note: >-
      grading/tiles/research.py::_precision_metric's base-rate-unavailable
      fallback, which grades RAW precision instead of precision-minus-base-rate
      and therefore needs an absolute bar rather than an edge bar.

